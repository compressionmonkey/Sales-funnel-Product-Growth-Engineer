
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTM board</title>
<style>
  :root {
    --bg: #f5f4f0;
    --card: #ffffff;
    --border: #e2e0d8;
    --text: #1f1f1d;
    --text-2: #6b6a64;
    --accent: #185fa5;
    --accent-bg: #e6f1fb;
    --success-bg: #eaf3de;
    --success-text: #3b6d11;
    --danger-bg: #fcebeb;
    --danger-text: #a32d2d;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: var(--radius);
    padding: 7px 14px;
    color: var(--text);
  }
  button:hover { background: #f0efe9; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover { background: #14528f; }
  input, select, textarea {
    font: inherit;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 7px 10px;
    background: var(--card);
    color: var(--text);
    width: 100%;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-bg);
  }
  label { font-size: 12px; color: var(--text-2); display: block; margin-bottom: 4px; }

  /* Login */
  #login-view {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 340px;
  }
  .login-card h1 { font-size: 20px; font-weight: 600; margin: 0 0 20px; }
  .login-card .field { margin-bottom: 14px; }
  #login-error { color: var(--danger-text); font-size: 13px; margin-top: 10px; display: none; }
  #config-warning {
    background: var(--danger-bg);
    color: var(--danger-text);
    border-radius: var(--radius);
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }

  /* Board */
  #app-view { display: none; padding: 16px 20px; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .topbar h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .topbar .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .topbar select { width: auto; }
  .topbar .who { font-size: 13px; color: var(--text-2); }

  /* Counters */
  .counters { display: flex; gap: 6px; align-items: center; }
  .counter {
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12.5px;
  }
  .counter b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .counter.overdue b { color: var(--danger-text); }
  .counter.won b { color: var(--success-text); }
  .counter.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg); }
  .counter:disabled { cursor: default; background: var(--card); }

  #tag-filter { border-radius: 999px; padding: 4px 12px; font-size: 12.5px; }
  #tag-filter.active {
    border-color: var(--accent);
    background: var(--accent-bg);
    color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-bg);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 12px;
    align-items: start;
  }
  @media (max-width: 900px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .column {
    background: #edece6;
    border-radius: 12px;
    padding: 10px;
    min-height: 200px;
  }
  .column.drag-over { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .column h2 {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 2px 4px 10px;
  }
  .added-today {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    border-radius: 999px;
    padding: 3px 10px;
    margin: 2px 4px 8px;
    background: var(--card);
    color: var(--text-2);
    border: 1px solid var(--border);
  }
  .added-today.some {
    background: var(--success-bg);
    color: var(--success-text);
    border-color: var(--success-bg);
  }

  /* Inline quick-add */
  .quick-add { margin-bottom: 8px; }
  .quick-add input {
    font-size: 13px;
    padding: 8px 10px;
    border-style: dashed;
    background: transparent;
  }
  .quick-add input:focus { background: var(--card); border-style: solid; }
  .quick-add .hint { font-size: 11px; color: var(--text-2); margin: 4px 2px 0; display: none; }
  .quick-add:focus-within .hint { display: block; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: grab;
  }
  .card:hover { border-color: #c9c7bd; }
  .card.dimmed { opacity: 0.35; }
  .card .name { font-weight: 600; font-size: 13px; margin: 0 0 3px; }
  .card .email { color: var(--text-2); font-size: 12px; margin: 0 0 8px; }
  .card .next { font-size: 12px; color: var(--accent); margin: 0 0 8px; }
  .card .next.overdue { color: var(--danger-text); }
  .card .meta { display: flex; justify-content: space-between; align-items: center; }
  .card .notes-count { font-size: 11px; color: var(--text-2); }
  .avatar {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--accent-bg);
    color: var(--accent);
    font-size: 10px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }
  .badge {
    font-size: 11px;
    border-radius: 6px;
    padding: 2px 8px;
    display: inline-block;
  }
  .badge.won { background: var(--success-bg); color: var(--success-text); }
  .badge.lost { background: var(--danger-bg); color: var(--danger-text); }
  .badge.tag {
    background: var(--accent-bg);
    color: var(--accent);
    margin-bottom: 6px;
  }
  .badge.tier {
    background: var(--bg);
    color: var(--text-2);
    border: 1px solid var(--border);
    margin-bottom: 6px;
  }
  .badge.no-response {
    background: var(--danger-bg);
    color: var(--danger-text);
    font-weight: 600;
    margin-bottom: 6px;
  }

  /* Email reader */
  .email-chip {
    border: none;
    background: var(--accent-bg);
    color: var(--accent);
    font-size: 11px;
    border-radius: 6px;
    padding: 3px 8px;
    margin: 0 0 8px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .email-chip:hover { background: #d5e7f8; }
  #em-sub { font-size: 12px; color: var(--text-2); margin: -10px 0 14px; }
  #em-body {
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    max-height: 55vh;
    overflow-y: auto;
    margin: 0;
    color: var(--text);
  }
  .field-head { display: flex; justify-content: space-between; align-items: baseline; }
  .field-head .reader-link {
    border: none;
    background: none;
    color: var(--accent);
    font-size: 12px;
    padding: 0;
  }
  .field-head .reader-link:hover { text-decoration: underline; background: none; }

  /* Next-action prompt */
  .next-prompt {
    position: fixed;
    left: 50%; bottom: 24px;
    transform: translateX(-50%);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(31,31,29,0.18);
    padding: 12px 16px;
    z-index: 30;
    display: none;
    max-width: calc(100vw - 32px);
  }
  .next-prompt.open { display: block; }
  .next-prompt .q { font-size: 13px; font-weight: 600; margin-bottom: 9px; }
  .next-prompt .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border-radius: 999px;
    padding: 5px 13px;
    font-size: 12.5px;
    background: var(--bg);
  }
  .chip:hover { border-color: var(--accent); background: var(--accent-bg); }

  /* Modal + drawer */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    display: none;
    z-index: 10;
  }
  .overlay.open { display: block; }
  .modal {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: var(--card);
    border-radius: 12px;
    padding: 24px;
    width: min(400px, calc(100vw - 32px));
    z-index: 12; /* above the drawer: the close modal can open from it */
    display: none;
  }
  .modal.open { display: block; animation: modal-pop 0.18s ease-out; }
  @keyframes modal-pop {
    from { opacity: 0; transform: translate(-50%, -48%) scale(0.96); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .modal.open { animation: none; }
  }
  .modal h3 { margin: 0 0 16px; font-size: 16px; }
  .modal .field { margin-bottom: 12px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(420px, 100vw);
    background: var(--card);
    border-left: 1px solid var(--border);
    z-index: 11;
    display: none;
    flex-direction: column;
  }
  .drawer.open { display: flex; }
  .drawer header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .drawer header h3 { margin: 0; font-size: 16px; }
  .drawer header .sub { font-size: 12px; color: var(--text-2); margin-top: 2px; }
  .drawer .body { padding: 16px 20px; overflow-y: auto; flex: 1; }
  .drawer .field { margin-bottom: 14px; }
  .note {
    border-left: 3px solid var(--accent-bg);
    padding: 6px 10px;
    margin-bottom: 10px;
  }
  .note .who { font-size: 11px; color: var(--text-2); margin-bottom: 2px; }
  .note .txt { font-size: 13px; white-space: pre-wrap; }
  .drawer footer { padding: 12px 20px; border-top: 1px solid var(--border); }
  .drawer footer .row { display: flex; gap: 8px; margin-top: 8px; }
  .icon-btn { border: none; background: none; padding: 4px; font-size: 16px; color: var(--text-2); }
  .icon-btn:hover { color: var(--text); background: none; }
  .danger-link { color: var(--danger-text); background: none; border: none; font-size: 12px; padding: 0; margin-top: 16px; }
  .danger-link:hover { text-decoration: underline; background: none; }

  /* Mobile */
  @media (max-width: 700px) {
    #app-view { padding: 12px; }
    /* 16px inputs stop iOS Safari from zooming the page on focus */
    input, select, textarea { font-size: 16px; }
    button { padding: 9px 14px; }
    .topbar { margin-bottom: 10px; }
    .topbar .who { display: none; }
    /* Columns become swipeable pages instead of one endless stack */
    .board {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 10px;
      margin: 0 -12px;
      padding: 0 12px 8px;
    }
    .column {
      flex: 0 0 84%;
      scroll-snap-align: start;
      min-height: 260px;
    }
    .next-prompt {
      left: 12px; right: 12px;
      transform: none;
      bottom: calc(12px + env(safe-area-inset-bottom));
      max-width: none;
    }
    .next-prompt .chips { justify-content: space-between; }
    .chip { padding: 8px 14px; }
    .drawer .body { padding: 14px 16px; }
    .drawer footer { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<div id="login-view">
  <div class="login-card">
    <h1>GTM board</h1>
    <div id="config-warning">Supabase is not configured yet — open index.html and fill in SUPABASE_URL and SUPABASE_ANON_KEY at the top of the script.</div>
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="primary" style="width:100%">Sign in</button>
      <p id="login-error"></p>
    </form>
  </div>
</div>

<div id="app-view">
  <div class="topbar">
    <h1>Pipeline</h1>
    <div class="controls">
      <div class="counters" id="counters"></div>
      <button id="tag-filter" title="Show only Bangkok trip leads">🌴 Bangkok trip</button>
      <select id="date-filter"><option value="">All dates</option></select>
      <select id="owner-filter"><option value="">All owners</option></select>
      <span class="who" id="who"></span>
      <button id="logout-btn">Sign out</button>
    </div>
  </div>
  <div class="board" id="board"></div>
</div>

<div class="next-prompt" id="next-prompt" role="dialog" aria-label="Set next action">
  <div class="q">Next action for <span id="np-name"></span>?</div>
  <div class="chips">
    <button class="chip" data-days="1">Tomorrow</button>
    <button class="chip" data-days="3">In 3 days</button>
    <button class="chip" data-days="7">Next week</button>
    <button class="chip" data-days="">No date</button>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<div class="modal" id="email-modal" role="dialog" aria-label="Email sent to this lead">
  <h3 id="em-title"></h3>
  <p id="em-sub"></p>
  <p id="em-body"></p>
  <div class="actions">
    <button type="button" data-close>Close</button>
  </div>
</div>

<div class="modal" id="close-modal">
  <h3>Close this lead</h3>
  <form id="close-form">
    <div class="field">
      <label>Outcome</label>
      <div style="display:flex; gap:8px;">
        <label style="display:flex; align-items:center; gap:6px; font-size:14px; color:var(--text);">
          <input type="radio" name="outcome" value="won" style="width:auto" required> Won
        </label>
        <label style="display:flex; align-items:center; gap:6px; font-size:14px; color:var(--text);">
          <input type="radio" name="outcome" value="lost" style="width:auto"> Lost
        </label>
      </div>
    </div>
    <div class="field" id="reason-field" style="display:none">
      <label for="lost-reason">Why lost? (price, timing, not a fit…)</label>
      <input id="lost-reason">
    </div>
    <div class="actions">
      <button type="button" data-close>Cancel</button>
      <button type="submit" class="primary">Close lead</button>
    </div>
  </form>
</div>

<div class="drawer" id="drawer">
  <header>
    <div>
      <h3 id="d-name"></h3>
      <div class="sub" id="d-sub"></div>
    </div>
    <button class="icon-btn" id="drawer-close" aria-label="Close">✕</button>
  </header>
  <div class="body">
    <div class="field">
      <label for="d-stage">Stage</label>
      <select id="d-stage"></select>
    </div>
    <div class="field">
      <label for="d-tier">Tier</label>
      <select id="d-tier"></select>
    </div>
    <div class="field">
      <label for="d-company">Company</label>
      <input id="d-company">
    </div>
    <div class="field">
      <label for="d-email">Contact email</label>
      <input id="d-email" type="email" placeholder="name@company.com">
    </div>
    <div class="field">
      <label for="d-linkedin">LinkedIn</label>
      <input id="d-linkedin" placeholder="linkedin.com/in/…">
    </div>
    <div class="field">
      <label style="display:flex; align-items:center; gap:6px; font-size:14px; color:var(--text); cursor:pointer;">
        <input id="d-tag" type="checkbox" style="width:auto"> 🌴 Bangkok trip lead
      </label>
    </div>
    <div class="field">
      <div class="field-head">
        <label for="d-email-summary">What did your email say?</label>
        <button type="button" class="reader-link" id="d-read-email">Read ↗</button>
      </div>
      <textarea id="d-email-summary" rows="3" placeholder="One-liner of the pitch you sent…"></textarea>
    </div>
    <div class="field">
      <label for="d-next">Next action date</label>
      <input id="d-next" type="date">
    </div>
    <label>Notes</label>
    <div id="d-notes"></div>
    <button class="danger-link" id="d-delete">Delete lead</button>
  </div>
  <footer>
    <textarea id="d-new-note" rows="2" placeholder="Add a note…"></textarea>
    <div class="row">
      <button class="primary" id="d-add-note" style="margin-left:auto">Add note</button>
    </div>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ============================================================
// CONFIG — paste your Supabase project values here.
// Find them in Supabase: Project settings -> API.
const SUPABASE_URL = "https://oozkbvhdgtvjqvqoggem.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_fxlWuiwU9in-gx1WkpSHGQ_sC8e87St";
// ============================================================

const NO_RESPONSE_DAYS = 5;
const BANGKOK_TAG = "bangkok-trip";

const TIERS = [
  { key: "tier_1", label: "Tier 1" },
  { key: "tier_2", label: "Tier 2" },
  { key: "tier_3", label: "Tier 3" },
];

const STAGES = [
  { key: "reached_out", label: "Reached out" },
  { key: "responded",   label: "Responded" },
  { key: "follow_up",   label: "Follow-up" },
  { key: "no_response", label: "No response" },
  { key: "closed",      label: "Closed" },
];

const $ = (id) => document.getElementById(id);
let db = null;
let me = null;
let leads = [];
let openLeadId = null;
let pendingCloseId = null;
let promptLeadId = null;
let spotlight = null; // 'overdue' | null
let tagFilter = false; // true = only Bangkok-trip-tagged leads

if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
  $("config-warning").style.display = "block";
} else {
  db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  init();
}

// --- Routing ---
// Login lives at /login, the board at /pipeline. Deep links only work when
// the host rewrites all paths to index.html (see _redirects for Netlify).
function navigate(path) {
  if (!location.protocol.startsWith("http")) return; // file:// — skip URL updates
  if (location.pathname !== path) history.replaceState(null, "", path);
}

window.addEventListener("popstate", () => navigate(me ? "/pipeline" : "/login"));

function showLogin() {
  me = null;
  $("app-view").style.display = "none";
  $("login-view").style.display = "flex";
  navigate("/login");
}

async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (session) enterApp(session.user);
  else showLogin();

  db.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_IN" && session && !me) enterApp(session.user);
    if (event === "SIGNED_OUT") {
      navigate("/login");
      location.reload();
    }
  });
}

$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!db) return;
  const err = $("login-error");
  err.style.display = "none";
  const { error } = await db.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("password").value,
  });
  if (error) {
    err.textContent = error.message;
    err.style.display = "block";
  }
});

function enterApp(user) {
  me = user;
  $("login-view").style.display = "none";
  $("app-view").style.display = "block";
  $("who").textContent = user.email;
  navigate("/pipeline");
  loadBoard();

  db.channel("board-changes")
    .on("postgres_changes", { event: "*", schema: "public", table: "leads" }, loadBoard)
    .on("postgres_changes", { event: "*", schema: "public", table: "notes" }, loadBoard)
    .subscribe();
}

$("logout-btn").addEventListener("click", async () => {
  await db.auth.signOut();
  showLogin();
});

async function loadBoard() {
  const { data, error } = await db
    .from("leads")
    .select("*, notes(count)")
    .order("next_action", { ascending: true, nullsFirst: false })
    .order("created_at", { ascending: false });
  if (error) { console.error(error); return; }
  leads = data;
  renderOwnerFilter();
  renderDateFilter();
  renderAll();
  if (openLeadId) refreshDrawer();
}

function renderAll() {
  renderCounters();
  renderBoard();
}

function visibleLeads() {
  const owner = $("owner-filter").value;
  const added = $("date-filter").value;
  return leads.filter((l) =>
    (!owner || l.owner === owner) &&
    (!added || addedDateKey(l.created_at) === added) &&
    (!tagFilter || l.tag === BANGKOK_TAG));
}

function renderOwnerFilter() {
  const sel = $("owner-filter");
  const current = sel.value;
  const owners = [...new Set(leads.map((l) => l.owner))].sort();
  sel.innerHTML = '<option value="">All owners</option>' +
    owners.map((o) => `<option value="${esc(o)}">${esc(shortName(o))}</option>`).join("");
  sel.value = current;
}

$("owner-filter").addEventListener("change", renderAll);

// Lists every distinct local date on which a lead was created, newest first,
// so the board can be narrowed to a single day's additions.
function renderDateFilter() {
  const sel = $("date-filter");
  const current = sel.value;
  const dates = [...new Set(leads.map((l) => addedDateKey(l.created_at)))].sort().reverse();
  const today = addedDateKey(new Date());
  sel.innerHTML = '<option value="">All dates</option>' +
    dates.map((d) => `<option value="${d}">${d === today ? "Today" : fmtDate(d)}</option>`).join("");
  sel.value = current;
}

$("date-filter").addEventListener("change", renderAll);

$("tag-filter").addEventListener("click", () => {
  tagFilter = !tagFilter;
  $("tag-filter").classList.toggle("active", tagFilter);
  renderAll();
});

// --- Counters ---
function renderCounters() {
  const overdue = leads.filter(isOverdue).length;
  const now = new Date();
  const won = leads.filter((l) => {
    if (l.outcome !== "won") return false;
    const d = new Date(l.last_activity);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  }).length;
  const mk = (cls, label, n, clickable) =>
    `<button class="counter ${cls}${spotlight === cls ? " active" : ""}" ${clickable ? `data-spot="${cls}"` : "disabled"}>
       <b>${n}</b> ${label}</button>`;
  $("counters").innerHTML =
    mk("overdue", "overdue", overdue, true) +
    mk("won", "won this month", won, false);
  document.querySelectorAll("[data-spot]").forEach((b) =>
    b.addEventListener("click", () => {
      spotlight = spotlight === b.dataset.spot ? null : b.dataset.spot;
      renderAll();
    }));
}

// --- Board ---
function renderBoard() {
  const board = $("board");
  const prevInput = $("quick-input");
  const keepValue = prevInput ? prevInput.value : "";
  const keepFocus = prevInput && document.activeElement === prevInput;
  board.innerHTML = "";
  const vis = visibleLeads();

  for (const stage of STAGES) {
    // Quiet cards float to the top of their column so they get chased first.
    const items = vis.filter((l) => l.stage === stage.key)
      .sort((a, b) => isNoResponse(b) - isNoResponse(a));
    const col = document.createElement("div");
    col.className = "column";
    col.dataset.stage = stage.key;
    col.innerHTML = `<h2>${stage.label} · ${items.length}</h2>`;

    if (stage.key === "reached_out") {
      // Counts every lead created today (local time), whatever stage
      // it has already moved to and whoever added it.
      const addedToday = leads.filter((l) =>
        new Date(l.created_at).toDateString() === new Date().toDateString()).length;
      const badge = document.createElement("div");
      badge.className = "added-today" + (addedToday ? " some" : "");
      badge.textContent = `${addedToday} added today`;
      col.prepend(badge);

      const qa = document.createElement("div");
      qa.className = "quick-add";
      qa.innerHTML = `
        <input id="quick-input" placeholder="+ Add a lead — press Enter" aria-label="Add a lead">
        <p class="hint">Paste a list to add one card per line. Emails &amp; LinkedIn URLs auto-fill their fields.</p>`;
      col.appendChild(qa);
    }

    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("drag-over"); });
    col.addEventListener("dragleave", () => col.classList.remove("drag-over"));
    col.addEventListener("drop", (e) => {
      e.preventDefault();
      col.classList.remove("drag-over");
      onDrop(e.dataTransfer.getData("text/plain"), stage.key);
    });

    for (const lead of items) col.appendChild(renderCard(lead));
    board.appendChild(col);
  }
  wireQuickAdd(keepValue, keepFocus);
}

function renderCard(lead) {
  const card = document.createElement("div");
  card.className = "card";
  if (spotlight === "overdue" && !isOverdue(lead)) card.classList.add("dimmed");
  card.draggable = true;
  card.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", lead.id));
  card.addEventListener("click", () => openDrawer(lead.id));

  const noteCount = lead.notes?.[0]?.count ?? 0;
  let middle = "";
  if (lead.stage === "closed" && lead.outcome) {
    const reason = lead.outcome === "lost" && lead.lost_reason ? " · " + esc(lead.lost_reason) : "";
    middle = `<span class="badge ${lead.outcome}">${lead.outcome === "won" ? "Won" : "Lost"}${reason}</span>`;
  } else if (lead.email) {
    middle = `<p class="email">${esc(lead.email)}</p>`;
  }

  let next = "";
  if (lead.stage !== "closed" && lead.next_action) {
    const overdue = lead.next_action < todayStr();
    next = `<p class="next${overdue ? " overdue" : ""}">Next: ${fmtDate(lead.next_action)}${overdue ? " (overdue)" : ""}</p>`;
  }

  const quiet = isNoResponse(lead)
    ? `<span class="badge no-response">No Response · ${daysSince(lead.last_activity)}d</span>`
    : "";
  const tag = lead.tag === BANGKOK_TAG ? `<span class="badge tag">🌴 Bangkok</span>` : "";
  const tierLabel = TIERS.find((t) => t.key === lead.tier)?.label;
  const tier = tierLabel ? `<span class="badge tier">${tierLabel}</span>` : "";
  card.innerHTML = `
    ${quiet}
    ${tag}
    ${tier}
    <p class="name">${esc(lead.name)}</p>
    ${middle}
    ${next}
    <div class="meta">
      <span class="notes-count">💬 ${noteCount}</span>
      <span class="avatar" title="${esc(lead.owner)}">${initials(lead.owner)}</span>
    </div>`;
  return card;
}

// --- Email reader ---
function openEmailModal(leadId, overrideText) {
  const lead = leads.find((l) => l.id === leadId);
  if (!lead) return;
  const text = overrideText ?? lead.email_summary;
  if (!text) return;
  $("em-title").textContent = lead.name;
  $("em-sub").textContent = `Email sent by ${shortName(lead.owner)}`;
  $("em-body").textContent = text;
  showModal("email-modal");
}

// --- Inline quick-add ---
function wireQuickAdd(keepValue, keepFocus) {
  const input = $("quick-input");
  if (!input) return;
  if (keepValue) input.value = keepValue;
  if (keepFocus) input.focus();
  input.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    addLeadsFromText(input.value);
    input.value = "";
  });
  input.addEventListener("paste", (e) => {
    const text = (e.clipboardData || window.clipboardData).getData("text");
    if (!text.includes("\n")) return;
    e.preventDefault();
    addLeadsFromText(text);
    input.value = "";
  });
}

async function addLeadsFromText(text) {
  const lines = text.split("\n").map((s) => s.trim()).filter(Boolean);
  if (!lines.length) return;
  const rows = lines.map((line) => {
    // Adding while the Bangkok filter is on tags the new lead, so it
    // doesn't vanish behind the very filter you're looking through.
    const row = { name: line, owner: me.email, tag: tagFilter ? BANGKOK_TAG : null };
    const isEmail = /\S+@\S+\.\S+/.test(line);
    const isLinkedin = /linkedin\.com|https?:\/\//i.test(line);
    if (isEmail) {
      row.email = line;
      row.name = line.match(/(\S+)@/)[1].replace(/[._-]/g, " ");
    } else if (isLinkedin) {
      row.linkedin = line;
      row.name = line.replace(/^https?:\/\/(www\.)?/i, "").replace(/linkedin\.com\/in\//i, "").replace(/\/$/, "");
    }
    return row;
  });
  const { error } = await db.from("leads").insert(rows);
  if (error) { console.error(error); return; }
  await loadBoard();
  const input = $("quick-input");
  if (input) input.focus();
}

// --- Drag → next-action prompt ---
async function onDrop(leadId, stage) {
  const lead = leads.find((l) => l.id === leadId);
  if (!lead || lead.stage === stage) return;

  if (stage === "closed") {
    pendingCloseId = leadId;
    $("close-form").reset();
    $("reason-field").style.display = "none";
    showModal("close-modal");
    return;
  }
  await db.from("leads").update({
    stage,
    outcome: null,
    lost_reason: null,
    last_activity: new Date().toISOString(),
  }).eq("id", leadId);
  await loadBoard();
  showNextPrompt(leadId);
}

function showNextPrompt(leadId) {
  const lead = leads.find((l) => l.id === leadId);
  if (!lead) return;
  promptLeadId = leadId;
  $("np-name").textContent = lead.name;
  $("next-prompt").classList.add("open");
}

function daysFromNow(n) {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

document.querySelectorAll("#next-prompt .chip").forEach((chip) =>
  chip.addEventListener("click", async () => {
    const leadId = promptLeadId;
    promptLeadId = null;
    $("next-prompt").classList.remove("open");
    if (!leadId) return;
    const next_action = chip.dataset.days === "" ? null : daysFromNow(Number(chip.dataset.days));
    await db.from("leads").update({ next_action }).eq("id", leadId);
    loadBoard();
  }));

// --- Close modal ---
document.querySelectorAll('input[name="outcome"]').forEach((r) =>
  r.addEventListener("change", () => {
    $("reason-field").style.display = r.value === "lost" && r.checked ? "block" : "none";
  })
);

$("close-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const outcome = new FormData(e.target).get("outcome");
  await db.from("leads").update({
    stage: "closed",
    outcome,
    lost_reason: outcome === "lost" ? $("lost-reason").value.trim() || null : null,
    last_activity: new Date().toISOString(),
  }).eq("id", pendingCloseId);
  pendingCloseId = null;
  hideModals();
  loadBoard();
});

// --- Drawer ---
function openDrawer(id) {
  openLeadId = id;
  refreshDrawer();
  $("overlay").classList.add("open");
  $("drawer").classList.add("open");
  loadNotes(id);
  // Surface the email right away — closing it reveals the drawer.
  openEmailModal(id);
}

function refreshDrawer() {
  const lead = leads.find((l) => l.id === openLeadId);
  if (!lead) { closeDrawer(); return; }
  $("d-name").textContent = lead.name;
  const stageLabel = STAGES.find((s) => s.key === lead.stage)?.label ?? lead.stage;
  $("d-sub").textContent = `${stageLabel} · added by ${shortName(lead.owner)}`;
  $("d-stage").innerHTML = STAGES.map((s) =>
    `<option value="${s.key}">${s.label}</option>`).join("");
  $("d-stage").value = lead.stage;
  $("d-tier").innerHTML = '<option value="">No tier</option>' + TIERS.map((t) =>
    `<option value="${t.key}">${t.label}</option>`).join("");
  $("d-tier").value = lead.tier ?? "";
  $("d-company").value = lead.name ?? "";
  $("d-email").value = lead.email ?? "";
  $("d-linkedin").value = lead.linkedin ?? "";
  $("d-email-summary").value = lead.email_summary ?? "";
  $("d-next").value = lead.next_action ?? "";
  $("d-tag").checked = lead.tag === BANGKOK_TAG;
}

async function loadNotes(leadId) {
  const box = $("d-notes");
  box.innerHTML = '<p style="color:var(--text-2); font-size:13px;">Loading…</p>';
  const { data } = await db.from("notes").select("*")
    .eq("lead_id", leadId).order("created_at", { ascending: false });
  if (leadId !== openLeadId) return;
  box.innerHTML = (data ?? []).map((n) => `
    <div class="note">
      <div class="who">${esc(shortName(n.author))} · ${fmtDateTime(n.created_at)}</div>
      <div class="txt">${esc(n.body)}</div>
    </div>`).join("") || '<p style="color:var(--text-2); font-size:13px;">No notes yet.</p>';
}

$("d-read-email").addEventListener("click", () => {
  // Read what's in the textarea, which may be newer than the saved value.
  if (openLeadId) openEmailModal(openLeadId, $("d-email-summary").value.trim());
});

// Moving without drag-and-drop (touch screens): same rules as a drop,
// including the forced Won/Lost modal for Closed.
$("d-stage").addEventListener("change", () => {
  if (openLeadId) onDrop(openLeadId, $("d-stage").value);
});

$("d-tier").addEventListener("change", async () => {
  if (!openLeadId) return;
  await db.from("leads").update({ tier: $("d-tier").value || null }).eq("id", openLeadId);
  loadBoard();
});

$("d-tag").addEventListener("change", async () => {
  if (!openLeadId) return;
  await db.from("leads").update({
    tag: $("d-tag").checked ? BANGKOK_TAG : null,
  }).eq("id", openLeadId);
  loadBoard();
});

$("d-add-note").addEventListener("click", async () => {
  const body = $("d-new-note").value.trim();
  if (!body || !openLeadId) return;
  const leadId = openLeadId;
  await db.from("notes").insert({ lead_id: leadId, author: me.email, body });
  await db.from("leads").update({ last_activity: new Date().toISOString() }).eq("id", leadId);
  $("d-new-note").value = "";
  loadNotes(leadId);
  await loadBoard();
  showNextPrompt(leadId); // every touch sets the next touch
});

let saveTimer = null;
for (const [id, field] of [["d-company", "name"], ["d-email", "email"], ["d-linkedin", "linkedin"], ["d-email-summary", "email_summary"], ["d-next", "next_action"]]) {
  $(id).addEventListener("input", () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      if (!openLeadId) return;
      await db.from("leads").update({ [field]: $(id).value || null }).eq("id", openLeadId);
      loadBoard();
    }, 600);
  });
}

$("d-delete").addEventListener("click", async () => {
  const lead = leads.find((l) => l.id === openLeadId);
  if (!lead || !confirm(`Delete "${lead.name}" and all its notes?`)) return;
  await db.from("leads").delete().eq("id", openLeadId);
  closeDrawer();
  loadBoard();
});

function closeDrawer() {
  openLeadId = null;
  $("drawer").classList.remove("open");
  $("overlay").classList.remove("open");
}
$("drawer-close").addEventListener("click", closeDrawer);

// --- Modal helpers ---
function showModal(id) {
  $("overlay").classList.add("open");
  $(id).classList.add("open");
}
function hideModals() {
  document.querySelectorAll(".modal").forEach((m) => m.classList.remove("open"));
  if (!openLeadId) $("overlay").classList.remove("open");
  else refreshDrawer(); // cancelling the close modal resets the stage select
}
$("overlay").addEventListener("click", () => { hideModals(); closeDrawer(); });
document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", hideModals));

// --- Utils ---
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function initials(email) {
  const name = email.split("@")[0];
  const parts = name.split(/[._-]/).filter(Boolean);
  return (parts.length > 1 ? parts[0][0] + parts[1][0] : name.slice(0, 2));
}
function shortName(email) { return email.split("@")[0]; }
function daysSince(iso) { return Math.floor((Date.now() - new Date(iso)) / 86400000); }
// Local calendar day of a timestamp, as YYYY-MM-DD — created_at is stored in
// UTC, so slicing the ISO string would put late-evening adds on the wrong day.
function addedDateKey(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function isOverdue(lead) { return lead.stage !== "closed" && lead.next_action && lead.next_action < todayStr(); }
// Quiet for too long — flagged on the card so you know to reach out again.
// The "No response" and "Closed" columns already say it themselves.
function isNoResponse(lead) {
  return lead.stage !== "closed" && lead.stage !== "no_response"
    && daysSince(lead.last_activity) >= NO_RESPONSE_DAYS;
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function fmtDate(d) {
  return new Date(d + "T00:00:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
}
function fmtDateTime(iso) {
  return new Date(iso).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
</script>
